[workspace]
resolver = "2"
members = ["crates/app", "crates/frontend", "crates/server", "crates/stack"]

# need to be applied only to wasm build
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.dependencies]
leptos = { version = "0.8.23" }
leptos_meta = { version = "0.8.7" }
leptos_router = { version = "0.8.17" }
leptos_axum = { version = "0.8.10" }
reactive_stores = { version = "0.4.4" }

axum = "0.8.9"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
log = "0.4.27"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio = { version = "1.45.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
wasm-bindgen = "0.2.106"

# See https://github.com/leptos-rs/cargo-leptos for documentation of all the parameters.

# A leptos project defines which workspace members
# that are used together frontend (lib) & server (bin)
[[workspace.metadata.leptos]]
name = "stackman"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false
